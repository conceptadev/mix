name: mix
description: An expressive way to effortlessly build design systems in Flutter.
version: 2.2.0-beta.5
homepage: https://github.com/btwld/mix
repository: https://github.com/btwld/mix/tree/main/packages/mix

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"
  
dependencies:
  flutter:
    sdk: flutter
  mix_annotations: ^2.2.0-beta.0
  # Resolved locally via the melos-managed pubspec_overrides.yaml; must be
  # published to pub.dev before mix itself is published.
  mix_core: ^0.1.0-dev.0

dev_dependencies:
  flutter_lints: ^6.0.0
  dart_code_metrics_presets: ^2.24.0
  build_runner: ^2.11.0
  mix_generator:
    version: ^2.2.0-beta.3
    path: ../mix_generator
  flutter_test:
    sdk: flutter

screenshots:
  - description: The Mix logo.
    path: screenshots/logo.png
