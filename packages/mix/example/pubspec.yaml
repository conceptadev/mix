name: mix_example
description: Public Mix examples, including WrapBox layout demonstrations.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  mix:
    path: ..

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/micro/examples/squish_switch/main.dart
    - lib/micro/examples/peek_rating/main.dart
    - lib/micro/examples/spring_check/main.dart
    - lib/micro/examples/rubber_segment/main.dart
    - lib/micro/examples/jelly_radio/main.dart
    - lib/micro/examples/glide_select/main.dart
    - lib/micro/examples/scrub_field/main.dart
    - lib/micro/examples/code_slots/main.dart
    - lib/micro/examples/wake_slider/main.dart
    - lib/micro/examples/comet_dial/main.dart
    - lib/micro/examples/hold_button/main.dart
    - lib/micro/examples/pulse_heart/main.dart
    - lib/micro/examples/slide_commit/main.dart
    - lib/micro/examples/fuse_button/main.dart
    - lib/micro/examples/bell_toggle/main.dart
    - lib/micro/examples/sling_button/main.dart
    - lib/micro/examples/dodge_field/main.dart
    - lib/micro/examples/swipe_row/main.dart
    - lib/micro/examples/warm_tooltip/main.dart
    - lib/micro/examples/swipe_toast/main.dart
    - lib/micro/examples/folder_float/main.dart
    - lib/micro/examples/branched_menu/main.dart
    - lib/micro/examples/lattice_loader/main.dart
    - lib/micro/examples/status_mark/main.dart
    - lib/micro/examples/call_chip/main.dart
    - lib/micro/examples/prompt_bar/main.dart
    - lib/micro/examples/voice_pill/main.dart
    - lib/micro/examples/thought_line/main.dart
    - lib/micro/examples/refine_frame/main.dart
    - lib/micro/examples/slosh_gauge/main.dart
